<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge — Legal</title>
  <style>
    :root {
      --primary: #FF6B35;
      --secondary: #F7931E;
      --bg: #F8FAFC;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #2a2f3a;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      padding: 56px 24px 48px;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    .header h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: 0.02em; }
    .header p { margin: 10px 0 0; font-size: 15px; opacity: 0.92; }
    main {
      flex: 1;
      max-width: 620px;
      width: 100%;
      margin: -24px auto 0;
      padding: 0 24px 48px;
    }
    .links { display: grid; gap: 16px; }
    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.10);
    }
    .link-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .link-text h2 { margin: 0 0 3px; font-size: 18px; font-weight: 700; }
    .link-text span { color: var(--muted); font-size: 14px; }
    .chevron { margin-left: auto; color: var(--muted); font-size: 22px; }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 24px;
    }
    .footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">🔥</div>
    <h1>Forge</h1>
    <p>Legal &amp; Privacy</p>
  </header>

  <main>
    <div class="links">
      <a class="link-card" href="privacy-policy.html">
        <div class="link-icon">🛡️</div>
        <div class="link-text">
          <h2>Privacy Policy</h2>
          <span>How we collect, use, and protect your data</span>
        </div>
        <div class="chevron">&rsaquo;</div>
      </a>
      <a class="link-card" href="terms-and-conditions.html">
        <div class="link-icon">📄</div>
        <div class="link-text">
          <h2>Terms &amp; Conditions</h2>
          <span>The rules for using the Forge app</span>
        </div>
        <div class="chevron">&rsaquo;</div>
      </a>
    </div>
  </main>

  <footer class="footer">
    <p>Questions? Contact us at <a href="mailto:hq.forgeapp@gmail.com">hq.forgeapp@gmail.com</a></p>
  </footer>
</body>
</html>
